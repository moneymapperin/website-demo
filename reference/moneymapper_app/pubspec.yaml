name: moneymapper_app
description: MoneyMapper - Financial Health Scoring Platform for India
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  shared_preferences: ^2.2.0
  provider: ^6.1.0
  fl_chart: ^0.65.0
  intl: ^0.20.2
  webview_flutter: ^4.4.2
  supabase_flutter: ^2.6.0
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  url_launcher: ^6.2.1
  local_auth: ^2.2.0
  mobile_scanner: ^6.0.2
  flutter_secure_storage: ^9.2.2
  dio: ^5.7.0
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1   # ← sirf ye line add karo

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/log 3d- hd -.png"
  adaptive_icon_background: "#09090B"
  adaptive_icon_foreground: "assets/log 3d- hd -.png"
  # Using a higher value for min_sdk to ensure adaptive icons work correctly
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # ── LOGO ASSETS REGISTER NODE ──
  assets:
    - assets/log 3d- hd -.png
    - assets/logo_new_removebg.png
    - assets/privacy_policy.html
    - assets/mascot no background -s.png
    - assets/spending1.png
    - assets/gold_brick.png
    - assets/quarterly_plan.png
    - assets/half_yearly_2.png
    - assets/yearly_plan_1.png
